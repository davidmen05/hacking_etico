<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mi Sitio{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <header>
        <h1>{% block header_title %}Flask Web App{% endblock %}</h1>
        <nav>
            <a href="{{ url_for('main.panel') }}">Panel</a>
            <a href="{{ url_for('main.home') }}">Inicio</a>
            <a href="{{ url_for('users.user', name='david') }}">Perfil David</a>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>&copy; 2026 Flask Web Application | Developed by Students</p>
    </footer>

</body>
</html>
